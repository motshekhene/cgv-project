<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Build a player</title>
    <style>
      body { margin: 0; padding: 24px; background: #12160f; color: #efe4c8; font: 15px/1.5 system-ui, sans-serif; }
      main { max-width: 640px; margin: 0 auto; }
      h1 { font-size: 20px; letter-spacing: 1px; }
      label { display: block; margin: 14px 0 4px; color: #c9b98f; }
      input[type='text'] { width: 100%; box-sizing: border-box; padding: 8px; background: #0b0d09; color: inherit; border: 1px solid #5a4f33; border-radius: 6px; }
      button { margin-top: 18px; padding: 10px 18px; background: #e3bb62; color: #1a1408; border: 0; border-radius: 6px; font-weight: 700; cursor: pointer; }
      button:disabled { opacity: 0.5; cursor: default; }
      pre { white-space: pre-wrap; background: #0b0d09; padding: 12px; border-radius: 6px; min-height: 3em; }
      code { color: #e3bb62; }
    </style>
  </head>
  <body>
    <main>
      <h1>Build a player</h1>
      <p>
        A Mixamo character (FBX Binary, with skin, T-pose) with all of Kai's moves, as the game loads it.
        Save both files into <code>assets/characters/</code>, then add the player to <code>src/player/roster.js</code>.
        See <code>tools/build-player.js</code>.
      </p>
      <label for="fbx">Character FBX</label>
      <input id="fbx" type="file" accept=".fbx" />
      <label for="id">File name (e.g. <code>thabo-ch22</code>)</label>
      <input id="id" type="text" placeholder="name-character" />
      <button id="go" type="button">Build</button>
      <pre id="log"></pre>
    </main>
    <script type="module">
      import { buildPlayer } from './build-player.js';

      window.buildPlayer = buildPlayer; // for scripts driving this page
      const $ = (id) => document.getElementById(id);
      const log = (s) => ($('log').textContent += s + '\n');
      const save = (blob, name) => {
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = name;
        a.click();
        setTimeout(() => URL.revokeObjectURL(a.href), 1000);
      };
      $('go').addEventListener('click', async () => {
        const file = $('fbx').files[0];
        const id = $('id').value.trim();
        if (!file || !id) return log('Pick an FBX and give it a file name.');
        $('go').disabled = true;
        $('log').textContent = '';
        log(`Building ${id} from ${file.name}...`);
        try {
          const { glb, meta, report } = await buildPlayer(file);
          log(JSON.stringify(report, null, 2));
          save(new Blob([glb], { type: 'model/gltf-binary' }), `${id}.glb`);
          save(new Blob([JSON.stringify(meta, null, 2) + '\n'], { type: 'application/json' }), `${id}.json`);
          log(`Saved ${id}.glb and ${id}.json.`);
        } catch (e) {
          log(`Failed: ${e.message || e}`);
        }
        $('go').disabled = false;
      });
    </script>
  </body>
</html>
