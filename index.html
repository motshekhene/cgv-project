<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Blackout Protocol — Alpha Demo</title>
<style>
  html, body { margin: 0; overflow: hidden; background: #05070a; height: 100%; }
  canvas { display: block; }
  * { box-sizing: border-box; }

  #hud {
    position: fixed; top: 16px; left: 16px; color: #8fd9ff;
    font-family: 'Courier New', monospace; font-size: 14px;
    background: rgba(0,0,0,0.4); padding: 10px 14px; border-radius: 6px;
    line-height: 1.5; display: none;
  }
  #hud b { color: #ffffff; }

  #home {
    position: fixed; inset: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    background: radial-gradient(ellipse at center, #0c1620 0%, #05070a 70%);
    font-family: 'Courier New', monospace;
    color: #ffffff;
    z-index: 10;
    text-align: center;
  }
  #home .tag { letter-spacing: 6px; font-size: 12px; color: #4fb3d9; margin-bottom: 14px; }
  #home h1 {
    font-size: 56px; letter-spacing: 10px; margin: 0;
    color: #eaf6ff;
    text-shadow: 0 0 18px rgba(79, 179, 217, 0.55);
  }
  #home .sub { margin-top: 10px; color: #7fa6bd; font-size: 13px; letter-spacing: 2px; max-width: 480px; }
  #home .verbs { display: flex; gap: 28px; margin-top: 40px; }
  #home .verb { font-size: 13px; letter-spacing: 3px; padding: 8px 16px; border: 1px solid #24404f; border-radius: 3px; opacity: 0.85; }
  #home .verb.run   { color: #66e0ff; border-color: #1c5f73; }
  #home .verb.drive { color: #ff7ad1; border-color: #7a2c5c; }
  #home .verb.fight { color: #ff9a4d; border-color: #7a4a1c; }
  #home button {
    margin-top: 46px; background: transparent; color: #66e0ff;
    border: 1px solid #2f8fb0; padding: 14px 38px; font-family: inherit;
    font-size: 14px; letter-spacing: 4px; cursor: pointer; border-radius: 3px;
    transition: background 0.2s ease, color 0.2s ease;
  }
  #home button:hover { background: #66e0ff; color: #05070a; }
  #home .hint { margin-top: 18px; font-size: 11px; color: #3d5b6b; letter-spacing: 2px; }
</style>
</head>
<body>

<div id="home">
  <div class="tag">CGV GROUP PROJECT &middot; ALPHA BUILD</div>
  <h1>BLACKOUT PROTOCOL</h1>
  <div class="sub">You escaped the subway&hellip; but he's still coming.</div>
  <div class="verbs">
    <div class="verb run">01&nbsp; RUN</div>
    <div class="verb drive">02&nbsp; DRIVE</div>
    <div class="verb fight">03&nbsp; FIGHT</div>
  </div>
  <button id="startBtn">START RUN</button>
  <div class="hint">A / D — lane &nbsp;&middot;&nbsp; SPACE — jump</div>
</div>

<div id="hud">
  <b>BLACKOUT PROTOCOL — Alpha</b><br>
  A / D — switch lane<br>
  SPACE — jump<br>
  Distance: <span id="distance">0</span>m
</div>

<script type="module" src="./src/main.js"></script>
</body>
</html>
